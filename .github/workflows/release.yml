name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - pre-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          - platform: ubuntu-latest
            bundles: appimage,deb,rpm
          - platform: windows-latest
            bundles: msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm install

      # main = stabiel kanaal (tag v*). pre-release branch = prerelease kanaal
      # met tag v<versie>-prerelease. Eén tag per versie.
      - name: Determine channel
        id: channel
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "endpoint=https://github.com/roanh47/Roans-Terminal/releases/latest/download/latest.json" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-prerelease" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}-prerelease" >> "$GITHUB_OUTPUT"
            echo "endpoint=https://github.com/roanh47/Roans-Terminal/releases/download/v${VERSION}-prerelease/latest.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: '{"plugins":{"updater":{"endpoints":["${{ steps.channel.outputs.endpoint }}"]}}}'

      - name: Rename installers + generate latest.json
        shell: bash
        run: python3 .github/rename.py
        env:
          SUFFIX: ${{ steps.channel.outputs.suffix }}
          TAG: ${{ steps.channel.outputs.tag }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}-prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge latest.json + collect installers
        run: python3 .github/merge.py

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.msi
            release/*.dmg
            release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
